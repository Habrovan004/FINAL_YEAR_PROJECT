databases:
  - name: mimba-yangu-db
    plan: free
    databaseName: mimba_yangu
    user: mimba_yangu

services:
  - type: web
    name: mama-care
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: mimba-yangu-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: AUTH_COOKIE_SAMESITE
        value: "None"
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_CHAT_HISTORY_LIMIT
        value: "20"
      - key: LOGIN_THROTTLE_LIMIT
        value: "5"
      - key: LOGIN_THROTTLE_WINDOW_SECONDS
        value: "600"
      - key: PASSWORD_RESET_THROTTLE_LIMIT
        value: "5"
      - key: PASSWORD_RESET_THROTTLE_WINDOW_SECONDS
        value: "600"
